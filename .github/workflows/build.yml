name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang NDK, CMake, dan platform
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build library Zygisk
        run: |
          cmake -S module -B module/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build module/build
          mkdir -p module/zygisk
          cp module/build/arm64-v8a.so module/zygisk/
          readelf -Ws module/zygisk/arm64-v8a.so | grep -q zygisk_module_entry
          readelf -Ws module/zygisk/arm64-v8a.so | grep -q zygisk_companion_entry

      - name: Build classes.dex payload
        run: bash tools/build-payload-dex.sh

      - name: Uji payload
        run: ./gradlew :payload:testDebugUnitTest --no-daemon

      - name: Paketkan modul Magisk
        run: bash tools/package-module.sh --so module/zygisk/arm64-v8a.so

      - name: Build APK pengendali
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Periksa isi APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/routtrans-module.zip'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: routtrans
          path: |
            dist/routtrans-module.zip
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
